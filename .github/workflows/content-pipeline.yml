---
# .github/workflows/content-pipeline.yml
# Generates social media drafts from approved stubs → Google Sheet

name: content-pipeline

on:
  push:
    paths:
      - "data/content-queue/*.yaml"
  workflow_dispatch:
    inputs:
      stub_file:
        description: "Single stub (e.g. data/content-queue/INGEST-2026-06-07-001.yaml)"
        required: false
      process_all:
        description: "Process all approved stubs"
        type: boolean
        default: false
  schedule:
    # 02:00 ET daily (07:00 UTC covers EDT)
    - cron: "0 7 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml gspread google-auth --quiet

      - name: Write service account credentials
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json

      - name: Generate (single stub)
        if: ${{ inputs.stub_file != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: /tmp/sa.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/content_gen.py --stub "${{ inputs.stub_file }}"

      - name: Generate (all approved)
        if: ${{ inputs.process_all == true || github.event_name == 'schedule' || (github.event_name == 'push' && inputs.stub_file == '') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: /tmp/sa.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/content_gen.py --all

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/sa.json
