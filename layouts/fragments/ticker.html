{{- $s := .Site.Data.stream -}}
<div class="fragment fragment--ticker" style="
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  background:var(--dark,#0d0d0b);
  color:rgba(209,250,229,.5);
  border-top:1px dotted rgba(209,250,229,.08);
  padding:0 12px;
  height:32px;
  display:flex;
  align-items:center;
  overflow:hidden;
  white-space:nowrap;
">
  <div style="animation:ticker 28s linear infinite">
    {{ $s.ticker }} ···
  </div>
</div>
<style>
@keyframes ticker{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
</style>
