<!DOCTYPE html>
<html lang="en">
<head>{{ partial "head.html" . }}<title>scene-outro</title></head>
<body>
{{- $s := .Site.Data.stream -}}
<div class="scene scene--light" style="display:flex;align-items:center;justify-content:center;flex-direction:column;">

  <hr style="position:absolute;top:14%;width:100%;border:none;border-top:1px dotted #aaa;">
  <hr style="position:absolute;bottom:14%;width:100%;border:none;border-top:1px dotted #aaa;">

  <div style="position:absolute;bottom:18%;left:28px;opacity:.06;">
    {{ partial "eyemark.html" (dict "size" 80 "bg" "#fffdfa" "fg" "#111") }}
  </div>

  <div style="text-align:center;">
    <div style="font-family:var(--font-mono);font-size:clamp(22px,4.5vw,60px);color:#111;letter-spacing:.04em;line-height:1;">
      {{ $s.handle }}<span class="cursor" style="color:#111"></span>
    </div>

    <hr style="width:36%;border:none;border-top:1px dotted #aaa;margin:clamp(10px,1.8vw,20px) auto;">

    <div style="font-family:var(--font-mono);font-size:clamp(8px,1.2vw,15px);color:#111;opacity:.55;letter-spacing:.06em;line-height:2.6;">
      {{ range $s.links }}<a href="{{ .url }}" style="display:block;color:inherit;text-decoration:none;">{{ .label }}</a>{{ end }}
    </div>

    <hr style="width:36%;border:none;border-top:1px dotted #aaa;margin:clamp(10px,1.8vw,20px) auto;">

    <div style="font-family:var(--font-sans);font-size:clamp(9px,1.3vw,16px);color:#111;opacity:.45;letter-spacing:.01em;">
      follow and support the work
    </div>
  </div>

  <div style="position:absolute;bottom:clamp(8px,1.5vw,18px);right:28px;font-family:var(--font-mono);font-size:clamp(7px,.85vw,10px);color:#111;opacity:.3;text-align:right;line-height:1.9;">
    {{ $s.pgp }}<br>ORCID {{ $s.orcid }}
  </div>

</div>
</body>
</html>
