<!DOCTYPE html>
<html lang="en">
<head>{{ partial "head.html" . }}<title>scene-offair</title></head>
<body>
{{- $s := .Site.Data.stream -}}
<div class="scene scene--dark">

  <!-- Attack dots — positioned to suggest a world map -->
  <div class="dot" style="top:32%;left:44%;width:6px;height:6px;background:#39ff14;animation-delay:0s"></div>
  <div class="dot" style="top:26%;left:72%;width:5px;height:5px;background:#ff1744;animation-delay:.9s"></div>
  <div class="dot" style="top:58%;left:21%;width:5px;height:5px;background:#39ff14;animation-delay:1.6s"></div>
  <div class="dot" style="top:44%;left:87%;width:4px;height:4px;background:#ffab00;animation-delay:.4s"></div>
  <div class="dot" style="top:65%;left:56%;width:6px;height:6px;background:#ff1744;animation-delay:2.1s"></div>
  <div class="dot" style="top:19%;left:31%;width:4px;height:4px;background:#39ff14;animation-delay:.7s"></div>
  <div class="dot" style="top:72%;left:67%;width:5px;height:5px;background:#ff1744;animation-delay:1.3s"></div>
  <div class="dot" style="top:38%;left:11%;width:4px;height:4px;background:#ffab00;animation-delay:2.4s"></div>
  <div class="dot" style="top:51%;left:63%;width:5px;height:5px;background:#39ff14;animation-delay:.2s"></div>

  <!-- Topbar — HTMX refreshes stats every 60s if endpoint exists -->
  <div class="topbar"
    hx-get="/stats.json"
    hx-trigger="every 60s"
    hx-swap="innerHTML"
    hx-target="#stats">
    <div id="stats" style="display:flex;align-items:center;gap:20px;font-size:12px;color:rgba(209,250,229,.45);">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:#39ff14;display:inline-block"></span>SSH <span style="color:rgba(209,250,229,.8)">—</span></span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:#ff1744;display:inline-block"></span>RDP <span style="color:rgba(209,250,229,.8)">—</span></span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:rgba(209,250,229,.25);display:inline-block"></span>HTTP <span style="color:rgba(209,250,229,.8)">—</span></span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:#ffab00;display:inline-block"></span>TELNET <span style="color:rgba(209,250,229,.8)">—</span></span>
    </div>
    <span style="margin-left:auto;color:rgba(209,250,229,.25);letter-spacing:.08em;font-size:12px">
      {{ $s.handle }} · OFF AIR<span class="cursor" style="color:rgba(209,250,229,.3)"></span>
    </span>
  </div>

  <!-- Eye/lens mark — pulsing -->
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
    <div style="opacity:.08;animation:pulse 7s ease-in-out infinite">
      {{ partial "eyemark.html" (dict "size" 140 "bg" "#0d0d0b" "fg" "#d1fae5") }}
    </div>
    <div style="font-family:var(--font-mono);font-size:14px;color:rgba(209,250,229,.18);letter-spacing:.2em;margin-top:10px;">
      — OFF AIR —
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:rgba(209,250,229,.1);letter-spacing:.1em;">
      {{ $s.site }}
    </div>
  </div>

  <!-- Ticker -->
  {{ partial "ticker.html" (dict "Site" .Site) }}

</div>
<style>
@keyframes pulse{0%,100%{opacity:.08}50%{opacity:.16}}
</style>
</body>
</html>
