<!DOCTYPE html>
<html lang="en">
<head>{{ partial "head.html" . }}<title>scene-intro-video</title></head>
{{- $s := .Site.Data.stream -}}
{{- $nb := .Site.Data.nowBuilding -}}
<body>
<div class="scene scene--dark" style="position:relative;">

  <!-- Background mark — large, low opacity, slow rotate -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;animation:bg-appear 3s ease forwards .2s;">
    <svg width="640" height="640" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
         style="animation:slow-rotate 180s linear infinite;transform-origin:320px 320px;">
      <circle cx="80" cy="80" r="78" fill="none" stroke="rgba(209,250,229,.04)" stroke-width=".5"/>
      <circle cx="80" cy="80" r="62" fill="none" stroke="rgba(209,250,229,.03)" stroke-width=".5"/>
      <ellipse cx="80" cy="80" rx="48" ry="28" fill="none" stroke="rgba(209,250,229,.05)" stroke-width=".5" transform="rotate(-25 80 80)"/>
      <circle cx="80" cy="80" r="22" fill="none" stroke="rgba(209,250,229,.04)" stroke-width=".5"/>
      <circle cx="80" cy="80" r="4" fill="rgba(209,250,229,.06)"/>
    </svg>
  </div>

  <!-- Content block — left aligned -->
  <div style="position:absolute;left:160px;top:50%;transform:translateY(-50%);">

    <div style="font-family:var(--font-mono);font-size:14px;letter-spacing:.2em;color:rgba(209,250,229,.25);text-transform:uppercase;opacity:0;animation:line-in .6s ease forwards 1s;margin-bottom:28px;">
      stream starting
    </div>

    <hr style="width:0;height:1px;border:none;background:rgba(209,250,229,.1);animation:rule-expand 1s ease forwards 1.6s;margin-bottom:48px;">

    <div style="font-family:var(--font-mono);font-size:96px;letter-spacing:.04em;color:rgba(209,250,229,.9);line-height:1;opacity:0;animation:line-in .8s ease forwards 2.4s;margin-bottom:20px;white-space:nowrap;">
      {{ $s.handle }}<span class="cursor" style="display:inline-block;width:.48em;height:.82em;background:rgba(209,250,229,.9);margin-left:.05em;vertical-align:-.06em;opacity:0;animation:cursor-appear .1s step-end forwards 3.4s,blink 1s step-end 3.6s infinite;"></span>
    </div>

    <div style="font-family:var(--font-mono);font-size:22px;letter-spacing:.12em;color:rgba(209,250,229,.3);opacity:0;animation:line-in .6s ease forwards 3.2s;margin-bottom:14px;">
      {{ $s.tagline }}
    </div>

    <div style="font-family:var(--font-mono);font-size:16px;letter-spacing:.1em;color:rgba(209,250,229,.18);opacity:0;animation:line-in .6s ease forwards 3.8s;">
      {{ $s.site }}
    </div>

    <hr style="width:0;height:1px;border:none;background:rgba(209,250,229,.1);animation:rule-expand 1s ease forwards 4.2s;margin-top:48px;">

  </div>

  <!-- Corner: PGP + ORCID -->
  <div style="position:absolute;right:160px;bottom:60px;font-family:var(--font-mono);font-size:13px;line-height:2;letter-spacing:.08em;color:rgba(209,250,229,.18);text-align:right;opacity:0;animation:line-in .6s ease forwards 4.6s;">
    {{ $s.pgp }}<br>ORCID {{ $s.orcid }}
  </div>

  <!-- Now building — top right -->
  {{ with $nb }}{{ with .current }}
  <div style="position:absolute;right:160px;top:60px;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;color:rgba(209,250,229,.15);text-align:right;opacity:0;animation:line-in .6s ease forwards 5s;">
    now: {{ .title }}
  </div>
  {{ end }}{{ end }}

</div>
<style>
@keyframes bg-appear{from{opacity:0}to{opacity:1}}
@keyframes slow-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes rule-expand{from{width:0}to{width:640px}}
@keyframes line-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes cursor-appear{to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</body>
</html>
