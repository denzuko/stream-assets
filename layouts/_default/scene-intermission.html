<!DOCTYPE html>
<html lang="en">
<head>{{ partial "head.html" . }}<title>scene-intermission</title></head>
<body>
{{- $s := .Site.Data.stream -}}
<div class="scene scene--dark">

  <!-- Topbar -->
  <div class="topbar">
    <span style="letter-spacing:.1em;">INTERMISSION</span>
    <span style="margin-left:auto;color:rgba(209,250,229,.22);letter-spacing:.08em;">
      {{ $s.handle }} · back shortly<span class="cursor" style="color:rgba(209,250,229,.25)"></span>
    </span>
  </div>

  <!-- Rotating eye mark -->
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;">
    <div style="opacity:.1;animation:pulse 7s ease-in-out infinite">
      {{ partial "eyemark.html" (dict "size" 140 "bg" "#0d0d0b" "fg" "#d1fae5" "rotate" true) }}
    </div>
    <div style="font-family:var(--font-mono);font-size:14px;color:rgba(209,250,229,.18);letter-spacing:.2em;margin-top:12px;">
      — BACK SHORTLY —
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:rgba(209,250,229,.1);letter-spacing:.1em;">
      {{ $s.site }}
    </div>
  </div>

  <!-- Ticker -->
  {{ partial "ticker.html" (dict "Site" .Site) }}

</div>
<style>
@keyframes pulse{0%,100%{opacity:.1}50%{opacity:.18}}
</style>
</body>
</html>
